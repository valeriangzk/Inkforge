name: Vérifier INKFORGE sous Windows
on:
  push:
    branches: [main, 'fix/**']
    tags: ['v*-rc.*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  studio:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.58.2
      - run: npx playwright install chromium
      - run: python tests/test_updates.py
      - run: node tests/browser.cjs
      - run: node tests/migration.cjs
      - run: python tools/prepare_release.py dist
      - uses: actions/upload-artifact@v4
        with:
          name: inkforge-verifie
          path: dist/
  candidate:
    if: startsWith(github.ref, 'refs/tags/') && contains(github.ref_name, '-rc.')
    needs: studio
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: inkforge-verifie
          path: dist
      - name: Joindre les fichiers vérifiés à la préversion
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
