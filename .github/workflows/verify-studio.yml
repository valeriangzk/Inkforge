name: Vérifier INKFORGE sous Windows
on:
  push:
    branches: [main, 'fix/**']
    tags: ['v*.*.*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      publier:
        description: 'Publier la version dès que les fichiers sont joints'
        type: boolean
        default: true
      notes:
        description: 'Notes affichées dans la fenêtre de mise à jour'
        type: string
        default: ''

permissions:
  contents: read

jobs:
  studio:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.58.2
      - run: npx playwright install chromium
      - run: python tests/test_updates.py
      - run: python tests/test_engine.py
      - run: node tests/browser.cjs
      - run: node tests/batch_views.cjs
      - run: node tests/migration.cjs
      - run: python tools/prepare_release.py dist
      - uses: actions/upload-artifact@v4
        with:
          name: inkforge-verifie
          path: dist/
  installation_windows:
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installer le moteur sur un Windows vierge et vérifier PyTorch
        run: |
          python -c "import serveur_inkforge as s; s.install_engine(); assert (s.LOCAL_3D/'ready-v1').is_file(); s.install_engine(); import subprocess; subprocess.run([str(s.engine_python()),'-c','import torch; assert torch.version.cuda'],check=True)"
      - name: Vérifier le dialogue avec le processus TripoSR installé sur le runner sans GPU
        shell: python
        run: |
          import tempfile
          import os, sys
          sys.path.insert(0, os.getcwd())
          from pathlib import Path
          import serveur_inkforge as studio
          with tempfile.TemporaryDirectory() as temp:
              try:
                  studio.warm_engine.run(Path(temp), 'preview')
              except studio.ClientFailure as exc:
                  assert 'CUDA indisponible' in str(exc), str(exc)
              else:
                  raise AssertionError('Le runner de test est prévu sans GPU')
              assert studio.warm_engine.process is None
  release_files:
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    needs: [studio, installation_windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: inkforge-verifie
          path: dist
      - name: Joindre les fichiers vérifiés au brouillon de publication
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          PUBLIER: ${{ inputs.publier }}
          NOTES: ${{ inputs.notes }}
        run: |
          version=$(jq -r .version dist/inkforge-update.json)
          # Lancement manuel depuis main : la version vient de version.json.
          target="--verify-tag"
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then TAG="v$version"; target="--target $GITHUB_SHA"; fi
          test "${TAG%%-rc.*}" = "v$version"
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            prerelease=""
            case "$TAG" in *-rc.*) prerelease="--prerelease";; esac
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft $target $prerelease \
              --title "INKFORGE Studio ${TAG#v}" --notes "${NOTES:-Mise à jour d’INKFORGE Studio ${TAG#v}.}"
          fi
          # Une release déjà publiée n'est jamais modifiée (cas du tag créé en publiant le brouillon).
          if [ "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" != true ]; then
            echo "Release $TAG déjà publiée : aucun fichier modifié."; exit 0
          fi
          gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY"
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && [ "$PUBLIER" = true ]; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
          fi
